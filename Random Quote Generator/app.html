<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A random quote generator powered by the DummyJSON Quotes API.">
  <title>Quote of the Moment | Team Quote</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="app-page">
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Team Quote home">TQ<span>.</span></a>
    <a class="text-link" href="index.html">Meet the team <span aria-hidden="true">&larr;</span></a>
  </header>

  <main class="quote-main">
    <p class="eyebrow">A small pause for your day</p>
    <h1>Quote of<br><span>the moment.</span></h1>
    <section class="quote-panel" aria-labelledby="quote-heading">
      <h2 id="quote-heading" class="sr-only">Your random quote</h2>
      <p id="quote" class="quote-text">Your next bit of inspiration is one click away.</p>
      <p id="author" class="quote-author">&mdash; Team Quote</p>
      <div class="quote-actions">
        <button id="newQuote" class="button" type="button">
          <span>Find a quote</span><span aria-hidden="true">&rarr;</span>
        </button>
        <p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p>
      </div>
    </section>
    <p class="api-credit">Quotes provided by <a href="https://dummyjson.com/docs/quotes" target="_blank" rel="noreferrer">DummyJSON</a>.</p>
  </main>
</body>
</html>
